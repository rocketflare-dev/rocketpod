name: CI

# The quality gate, run as PARALLEL jobs that each run one part of the same commands a person runs
# before committing (and Launch's ship gate runs in a sandbox, docs/CONCEPTS.md §4): `pnpm gate
# <step>` and the gate's test runner `pnpm test --only <part> [--shard i/N]`
# (scripts/lib/test-plan.mjs). The parts together are exactly `pnpm gate` — `gate.test.ts` proves
# the `--only` parts are the whole plan and the shards are the unsharded run — and the workflow adds
# no check of its own beyond gitleaks, so what passes here is what passes on a laptop.
#
#   static          gitleaks, then `pnpm gate lint typecheck build`
#   test (packages) `pnpm test --only packages` — no database
#   test (api)      `pnpm test --only api` — the --no-isolate web run
#   test (rest i/4) `pnpm test --only rest --shard i/4` — the other web projects (api-isolated,
#                   driver, ui, config, and kit-only in the kit), split by vitest's own --shard
#   Gate            needs every job above; fails unless all of them succeeded
#
# `Gate` is the one required check, and the workflow's conclusion (what image.yml's tag wait reads)
# is a failure whenever any job failed. Four rest shards because that run is the long one: most of
# it is per-file collect/environment cost, which a shard divides.
#
# `pnpm test` starts the test Postgres from `apps/web/docker-compose.test.yml` itself (a packages
# run starts none) and the `driver` conformance project runs in a rest shard
# (apps/web/src/db/CLAUDE.md). No `services:` block, no restart hack: the compose file is the one
# definition of the test database.
#
# A release workflow may call this same file (`workflow_call`) before publishing a tag whose commit
# has no green CI run yet, so a commit is gated once and the gate never drifts. The kit's OWN checks
# (a renamed copy, the default plugins, the porting note) are kit.yml, which a copy never carries.
#
# Verified once (opt-in, for an app shipped by Launch): with the repository variable
# LAUNCH_GATE_APP_ID set to Launch's GitHub App id, EVERY job's first step asks whether Launch
# already gated the exact tree under test — a `launch/gate` check run from THAT app, `success`, whose
# `external_id` is `tree:<tree sha>` (scripts/gate-verified.mjs, rules in
# scripts/lib/gate-verified-lib.mjs). If so `static` runs only what the sandbox does not — gitleaks
# and `pnpm gate build` — and every test job stops after the lookup (green, nothing run). Variable
# unset: the step is skipped (no API call) and every job runs its part. The lookup is repeated per
# job rather than made a job of its own, so no job queues behind another runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  # Cancel superseded runs on a PR branch, never when called from a release workflow.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static (gitleaks, lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The lookup reads check runs and a commit's pull requests; nothing in this workflow writes. A
    # caller must grant the same three: a called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the gitleaks scan
      # Was this tree already gated by Launch? Skipped outright without LAUNCH_GATE_APP_ID. Which
      # tree is compared: the CHECKED-OUT commit's — on a pull request GitHub's merge commit, the
      # bytes this job tests. Launch attests the PR head, so the head's attestation counts only when
      # the merge tree equals it (the branch already contains main's tip); once main moves on, the
      # trees differ and the full gate runs. On a push to main: the pushed commit, then the heads of
      # its PRs (GET /commits/{sha}/pulls) — an up-to-date PR squashed or merged leaves the same
      # tree. Any other event (a workflow_call on a tag or dispatch) answers false. Any
      # doubt answers false, and the script always exits 0: an empty or `false` output is the full
      # gate. It reads the tree from this very checkout, so there is nothing to re-check.
      - name: Verified by Launch?
        id: verified
        if: vars.LAUNCH_GATE_APP_ID != ''
        run: node scripts/gate-verified.mjs
        env:
          LAUNCH_GATE_APP_ID: ${{ vars.LAUNCH_GATE_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # pnpm version comes from `packageManager` in the root package.json. Must precede setup-node
      # so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Repository hygiene, not an app check, so it is not a gate step: the full history, so a
      # secret committed and then removed is still caught. The binary directly (the marketplace
      # action needs a licence for org repos).
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --verbose .

      # Launch's sandbox already passed lint, typecheck and test on this tree; build is the step it
      # does not prove here (the UI bundle and the server bundle).
      - name: pnpm gate build (the rest passed in Launch on this tree)
        if: steps.verified.outputs.verified == 'true'
        run: pnpm gate build

      # Every gate step but `test`, which the test jobs below run in parts.
      - name: pnpm gate lint typecheck build
        if: steps.verified.outputs.verified != 'true'
        run: pnpm gate lint typecheck build

  test:
    name: Test (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: read
    strategy:
      # Every part reports, like `pnpm gate --keep-going`: one red shard does not hide another.
      fail-fast: false
      matrix:
        include:
          - part: packages
            args: --only packages
            database: false
          - part: api
            args: --only api
            database: true
          - part: rest 1/4
            args: --only rest --shard 1/4
            database: true
          - part: rest 2/4
            args: --only rest --shard 2/4
            database: true
          - part: rest 3/4
            args: --only rest --shard 3/4
            database: true
          - part: rest 4/4
            args: --only rest --shard 4/4
            database: true
    steps:
      - uses: actions/checkout@v7
      # The same lookup as `static` (see there). Verified: this part passed in Launch on this tree.
      - name: Verified by Launch?
        id: verified
        if: vars.LAUNCH_GATE_APP_ID != ''
        run: node scripts/gate-verified.mjs
        env:
          LAUNCH_GATE_APP_ID: ${{ vars.LAUNCH_GATE_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The test image, pulled in the background while pnpm installs (~15-20 s a run). If it has
      # not arrived by the time `pnpm test` runs `docker compose up`, that pulls it itself.
      - name: Pre-pull the test database images
        if: matrix.database && steps.verified.outputs.verified != 'true'
        run: |
          nohup docker compose -f apps/web/docker-compose.test.yml pull --quiet \
            > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: pnpm/action-setup@v6
        if: steps.verified.outputs.verified != 'true'
      - uses: actions/setup-node@v7
        if: steps.verified.outputs.verified != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.verified.outputs.verified != 'true'
        run: pnpm install --frozen-lockfile

      - name: pnpm test ${{ matrix.args }}
        if: steps.verified.outputs.verified != 'true'
        run: pnpm test ${{ matrix.args }}

  # The one required check. `always()` so it reports (red) when a job it needs failed or was
  # cancelled, instead of being skipped — a skipped required check would let a merge through.
  gate:
    name: Gate
    needs: [static, test]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every part of the gate passed
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "static: $STATIC · test: $TEST"
          if [ "$STATIC" != success ] || [ "$TEST" != success ]; then
            echo "::error::the gate failed (static: $STATIC, test: $TEST)"
            exit 1
          fi
          echo "✔ every part of pnpm gate passed"
