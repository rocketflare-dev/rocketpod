# Test Postgres on 5433. `max_connections=300` because vitest runs several forks, each with
# its own pools; at the 100 default the suite flaked ~1 in 8 with "53300 too many clients".
# The ONE definition of the test database: `pnpm test` starts it (with `--wait`), and CI, plugin
# CI and the evals workflow all start it from here rather than a `services:` block.
#
# `name:` pins the Compose project per app (the rename moves it with the slug). Without it the
# project was `web` — the directory — in every copy of the kit, so `pnpm test:db:up` in one copy
# recreated another copy's test Postgres on its volume (#38). Both still publish 5433.
name: rocketpod-test

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: rocketpod-test-postgres
    command: -c max_connections=300
    environment:
      POSTGRES_DB: rocketpod_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rocketpod_test"]
      interval: 5s
      timeout: 5s
      retries: 5
