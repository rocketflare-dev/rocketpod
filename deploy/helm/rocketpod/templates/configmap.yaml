{{- if not .Values.config.APP_URL }}
{{- fail "config.APP_URL is required: the public origin, e.g. https://app.example.com" }}
{{- end }}
{{- if and .Values.publicSites.hosts (not .Values.publicSites.hostsVar) }}
{{- fail "publicSites.hosts needs publicSites.hostsVar: the var the plugin's manifest names" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocketpod.fullname" . }}
  labels:
    {{- include "rocketpod.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.publicSites }}
  {{- if and .hostsVar .hosts }}
  {{ .hostsVar }}: {{ join "," .hosts | quote }}
  {{- end }}
  {{- end }}
