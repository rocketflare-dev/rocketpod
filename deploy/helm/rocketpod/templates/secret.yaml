{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.DATABASE_URL }}
{{- fail "secrets.DATABASE_URL is required (or set existingSecret)" }}
{{- end }}
{{- if and .Values.migrate.ownerOnly (not .Values.secrets.APP_DATABASE_URL) }}
{{- fail "migrate.ownerOnly needs secrets.APP_DATABASE_URL: web and worker connect with it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketpod.fullname" . }}
  labels:
    {{- include "rocketpod.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne (toString $value) "") (not (and $.Values.migrate.ownerOnly (eq $key "DATABASE_URL"))) }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
