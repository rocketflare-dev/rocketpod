{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.DATABASE_URL }}
{{- fail "secrets.DATABASE_URL is required (or set existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketpod.fullname" . }}
  labels:
    {{- include "rocketpod.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
